name: JD 需求看板发布

# 本地 Windows 计划任务每天拉 TAPD 并生成 HTML，push 到 main 后这里只负责发布。
# GitHub 侧不再访问 TAPD MCP 代理（该代理 DNS 仅内网可达）。
on:
  push:
    branches:
      - main
    paths:
      - 'deploy/site/index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/site

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
